[workspace]

[workspace.publish]
agents = ["github-copilot", "claude"]
marketplace_name = "skillet"
owner_name = "Jesse Wellenberg"

[vars]
project_name = "skillet"

[lint]
max_activation_tokens = 4000
max_discovery_tokens = 100
max_fragment_tokens = 500

[build]
tokenizer = "cl100k_base"
verify_urls = false

[module.skillet]
publish = true
src_dir = "src/skills"
out_dir = "skills"
version = "0.1.0"
fragments_dir = "src/skills/_fragments"
