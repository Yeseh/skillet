[package]
name = "skillet-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "skillet"
path = "src/main.rs"

[dependencies]
skillet = { path = "../skillet" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
toml = "1.1.2+spec"
walkdir = "2"
serde_json = "1.0.149"
serde = { version = "1", features = ["derive"] }
rustls = { version = "0.23", features = ["tls12"] }
webpki-roots = "1.0.7"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11.0"
hex = "0.4.3"
owo-colors = "4.3.0"
rayon = "1"
regex = "1"

[dev-dependencies]
tempfile = "3"
