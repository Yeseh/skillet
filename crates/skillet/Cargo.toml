[package]
name = "skillet"
version = "0.1.0"
edition = "2021"
authors = ["Jesse Wellenberg"]

[dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }
walkdir = "2"
anyhow = "1"
regex = "1.12.3"
sha2 = "0.11.0"
hex = "0.4.3"
chrono = { version = "0.4.44", features = ["serde"] }
gray_matter = "0.3.2"
owo-colors = "4.3.0"
serde_json = "1.0.149"
rustls = { version = "0.23", features = ["tls12"] }
webpki-roots = "0.26"
tiktoken-rs = "0.11"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "lint"
harness = false

[lints.rust]
missing_docs = "warn"
